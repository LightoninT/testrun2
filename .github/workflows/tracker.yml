name: tracker

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub's minimum effective cadence)
  workflow_dispatch:          # Actions tab → "Run workflow" button runs it on demand

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tracker (single poll)
        run: python3 tracker.py --once
      - name: Export latest matches for the webpage
        run: |
          python3 -c "
          import sqlite3, json
          con = sqlite3.connect('matches.db')
          try:
              rows = con.execute('SELECT group_id,phrase,platform,title,snippet,url,source,published,detected_at FROM matches ORDER BY id DESC LIMIT 100').fetchall()
          except Exception:
              rows = []
          con.close()
          keys = ['group','phrase','platform','title','snippet','url','source','published','detected_at']
          state = {}
          try:
              state = json.load(open('state.json'))
          except Exception:
              pass
          json.dump({'last_run': state.get('last_run'), 'total': state.get('total_matches', len(rows)),
                     'matches': [dict(zip(keys, r)) for r in rows]},
                    open('docs/latest-matches.json','w'), ensure_ascii=False, indent=2)
          "
      - name: Commit results (dashboard + JSON feed)
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add docs/latest-matches.json dashboard.html state.json || true
          git diff --cached --quiet || git commit -m "tracker scan $(date -u +%FT%TZ)"
          git push
