name: tracker

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub's minimum effective cadence)
  workflow_dispatch:          # Actions tab → "Run workflow" button runs it on demand

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}
  ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
  ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
  MATCH_WEBHOOK_URL: ${{ secrets.MATCH_WEBHOOK_URL }}
  META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
  META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
  META_FB_PAGE_TOKEN: ${{ secrets.META_FB_PAGE_TOKEN }}
  META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
  THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
  THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tracker (single poll)
        run: python3 tracker.py --once
      - name: Export latest matches for the webpage
        run: |
          python3 -c "
          import sqlite3, json
          con = sqlite3.connect('matches.db')
          try:
              rows = con.execute('SELECT group_id,phrase,platform,title,snippet,url,source,published,detected_at,item_type,parent_url FROM matches ORDER BY id DESC LIMIT 100').fetchall()
          except Exception:
              rows = []
          con.close()
          keys = ['group','phrase','platform','title','snippet','url','source','published','detected_at','item_type','parent_url']
          state = {}
          try:
              state = json.load(open('state.json'))
          except Exception:
              pass
          json.dump({'last_run': state.get('last_run'), 'total': state.get('total_matches', len(rows)),
                     'matches': [dict(zip(keys, r)) for r in rows]},
                    open('docs/latest-matches.json','w'), ensure_ascii=False, indent=2)
          "
      - name: Commit results (DB dedup state + dashboard + JSON feed)
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git pull --rebase || true
          git add matches.db docs/latest-matches.json dashboard.html state.json || true
          git diff --cached --quiet || git commit -m "tracker scan $(date -u +%FT%TZ)"
          git push
