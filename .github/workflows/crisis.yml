name: crisis-scan

# PR-CRISIS rapid scanner: same tracker, 5-minute cadence + crisis posture.
#
# ARMING (pick one):
#   1. One-click scan from your phone: Actions tab → crisis-scan → Run workflow.
#   2. Continuous 5-min scans: uncomment the schedule block below, commit, push.
#      When the crisis ends, re-comment it (or delete this file's schedule) to
#      stop burning Actions minutes.
#   3. Local/VPS instead: python3 tracker.py --watch --interval 5 --crisis
#
# REQUIRED SECRETS for full coverage (repo Settings → Secrets → Actions):
#   META_IG_TOKEN, META_IG_USER_ID, META_FB_PAGE_TOKEN, META_FB_PAGE_ID
#                                         (comment bodies + owned mentions)
# Updates surface on the webpage dashboard — no notification secrets exist.

on:
  workflow_dispatch:          # one-click crisis scan — no schedule needed
  # schedule:
  #   - cron: "*/5 * * * *"   # <-- uncomment to arm continuous 5-min crisis scans

permissions:
  contents: write

env:
  TRACKER_CRISIS: "1"         # force crisis posture regardless of config.json
  # Dashboard-only alerting: no notification secrets. Meta tokens enable
  # comment bodies + owned mentions; empty = gracefully skipped.
  META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
  META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
  META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
  META_FB_PAGE_TOKEN: ${{ secrets.META_FB_PAGE_TOKEN }}
  META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
  THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
  THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crisis scan (single poll, fresh-only alerts)
        run: python3 tracker.py --once
      - name: Export latest matches for the webpage
        run: |
          python3 -c "
          import sqlite3, json
          con = sqlite3.connect('matches.db')
          try:
              rows = con.execute('SELECT group_id,phrase,platform,title,snippet,url,source,published,detected_at,item_type,parent_url FROM matches ORDER BY id DESC LIMIT 100').fetchall()
          except Exception:
              rows = []
          con.close()
          keys = ['group','phrase','platform','title','snippet','url','source','published','detected_at','item_type','parent_url']
          state = {}
          try:
              state = json.load(open('state.json'))
          except Exception:
              pass
          json.dump({'last_run': state.get('last_run'), 'total': state.get('total_matches', len(rows)),
                     'matches': [dict(zip(keys, r)) for r in rows]},
                    open('docs/latest-matches.json','w'), ensure_ascii=False, indent=2)
          "
      - name: Commit results (DB dedup state + dashboard + JSON feed)
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git pull --rebase || true
          git add matches.db docs/latest-matches.json dashboard.html state.json || true
          git diff --cached --quiet || git commit -m "crisis scan $(date -u +%FT%TZ)"
          git push
